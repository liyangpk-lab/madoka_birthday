        let currentScaleMode = localStorage.getItem('scale_mode') || 'fit'; // 'fit' or '1to1'

        function applyScale() {
            const container = document.getElementById('posterContainer');
            const wrapper = document.getElementById('posterWrapper');
            if (!container || !wrapper) return;

            const baseWidth = 3840;
            const containerHeight = container.offsetHeight || 2160;

            let scale = 1;
            if (currentScaleMode === 'fit') {
                const windowW = window.innerWidth;
                scale = windowW / baseWidth;
                if (scale < 0.05) scale = 0.05;
                if (scale > 2.0) scale = 2.0;
            } else {
                scale = 1;
            }

            container.style.transformOrigin = 'top center';
            container.style.transform = `scale(${scale})`;
            wrapper.style.height = (containerHeight * scale) + 'px';
            container.style.setProperty('--canvas-scale', scale);

            const btnFit = document.getElementById('btnScaleFit');
            const btn1to1 = document.getElementById('btnScale1to1');
            if (btnFit && btn1to1) {
                btnFit.classList.toggle('active', currentScaleMode === 'fit');
                btn1to1.classList.toggle('active', currentScaleMode === '1to1');
            }
        }

        // 6. 随着卡片增多，动态向下延伸手机相纸背景的总高度
        function adjustPosterHeight() {
            const container = document.getElementById('posterContainer');
            const photos = container.querySelectorAll('.photo');
            const messages = container.querySelectorAll('.handwritten-msg, .sticky-note');
            
            let maxBottom = 2160; // 4K 默认初始高度
            
            // 扫描所有相片底边缘
            photos.forEach(el => {
                const top = parseFloat(el.style.top || 0);
                const height = el.offsetHeight || 500;
                if (top + height + 250 > maxBottom) { // 给最下方的贺词留出充足的空间（防遮挡）
                    maxBottom = top + height + 250;
                }
            });

            // 扫描所有留言底边缘
            messages.forEach(el => {
                const top = parseFloat(el.style.top || 0);
                const height = el.offsetHeight || 300;
                if (top + height + 250 > maxBottom) { // 给最下方的贺词留出充足的空间（防遮挡）
                    maxBottom = top + height + 250;
                }
            });

            // 赋以新高度
            container.style.height = maxBottom + 'px';

            // 重新应用缩放以更新 wrapper 高度
            applyScale();
        }

        // ==========================================
        // 📌 自由拖动摆放交互系统 (Draggable Control)
        // ==========================================
        function makeDraggable(element) {
            // 支持鼠标事件
            element.addEventListener('mousedown', dragStart, { passive: false });
            // 支持移动端触屏
            element.addEventListener('touchstart', dragStart, { passive: false });

            // 移动端单触激活手柄显示
            element.addEventListener('touchstart', function(e) {
                // 如果点的是控制手柄，不要取消激活
                if (e.target.closest('.delete-btn') || e.target.closest('.rotate-handle') || e.target.closest('.resize-handle')) {
                    return;
                }
                
                // 移除其他所有卡片的激活状态
                document.querySelectorAll('.photo, .handwritten-msg, .sticky-note').forEach(el => {
                    if (el !== element) el.classList.remove('touch-active');
                });
                
                // 切换当前卡片的激活状态
                element.classList.toggle('touch-active');
            }, { passive: true });
        }

        function dragStart(e) {
            // 如果点到的是删除/旋转/缩放控件，不触发拖动
            if (e.target.closest('.delete-btn') || e.target.closest('.rotate-handle') || e.target.closest('.resize-handle')) {
                return;
            }

            activeDragElement = this;
            
            // 提升当前被拖拽的图层置于最顶层
            document.querySelectorAll('.photo, .handwritten-msg, .sticky-note').forEach(el => {
                if (el.classList.contains('photo') && el.id && el.id.startsWith('orig_')) {
                    el.style.zIndex = 3;
                } else if (el.classList.contains('photo')) {
                    el.style.zIndex = 6;
                } else if (el.classList.contains('sticky-note')) {
                    el.style.zIndex = 8;
                } else {
                    el.style.zIndex = 10;
                }
            });
            this.style.zIndex = 999; 

            // 解析当前绝对定位
            elementX = parseFloat(this.style.left || 0);
            elementY = parseFloat(this.style.top || 0);

            // 获取事件坐标
            if (e.type === 'touchstart') {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            } else {
                startX = e.clientX;
                startY = e.clientY;
                e.preventDefault(); // 防止拖动产生文本选中
            }

            document.addEventListener('mousemove', dragMove, { passive: false });
            document.addEventListener('touchmove', dragMove, { passive: false });
            document.addEventListener('mouseup', dragEnd, { passive: false });
            document.addEventListener('touchend', dragEnd, { passive: false });
        }

        function dragMove(e) {
            if (!activeDragElement) return;

            let clientX, clientY;
            if (e.type === 'touchmove') {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const dx = clientX - startX;
            const dy = clientY - startY;

            // 获取缩放比以进行精确拖动补偿
            const scale = getContainerScale();

            // 考虑缩放比计算出实际在 4K 空间中的移动偏移量
            let newX = elementX + (dx / scale);
            let newY = elementY + (dy / scale);
            
            // 4K 画布边界限制 (宽度 3840px, 高度不限但大于 120px 避开标题)
            const cardWidth = activeDragElement.offsetWidth || 480;
            const maxW = 3840 - cardWidth;
            
            newX = Math.max(20, Math.min(maxW - 20, newX));
            newY = Math.max(120, newY); // 避开 Title Header

            activeDragElement.style.left = newX + 'px';
            activeDragElement.style.top = newY + 'px';
        }

        function dragEnd() {
            if (!activeDragElement) return;

            // 保存被拖拽元素的新坐标
            const id = activeDragElement.id;
            const left = activeDragElement.style.left;
            const top = activeDragElement.style.top;

            if (id && id.startsWith('orig_')) {
                // 原有7张图的坐标
                originalPositions[id] = { left, top };
                localStorage.setItem('orig_positions', JSON.stringify(originalPositions));
            } else if (id) {
                // 新上传的留言与贺图坐标
                const itemIndex = addedItems.findIndex(i => i.id === id);
                if (itemIndex > -1) {
                    const newX = parseFloat(left);
                    const newY = parseFloat(top);
                    addedItems[itemIndex].x = newX;
                    addedItems[itemIndex].y = newY;
                    saveToLocalStorage();
                    cloudUpdatePosition(id, newX, newY);
                }
            }

            activeDragElement = null;
            document.removeEventListener('mousemove', dragMove);
            document.removeEventListener('touchmove', dragMove);
            document.removeEventListener('mouseup', dragEnd);
            document.removeEventListener('touchend', dragEnd);

            // 动态调节画布高度
            adjustPosterHeight();
        }

        // ==========================================
        // 💾 本地存储与云同步接口 (Data Management)
        // ==========================================
        
        let supabaseClient = null;

        // 1. 动态加载 Supabase CDN 并初始化
        function checkAndInitCloud() {
            if (CLOUD_CONFIG.enable) {
                console.log("检测到开启云同步，正在载入 Supabase...");
                const script = document.createElement('script');
                script.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
                script.onload = () => {
                    try {
                        supabaseClient = supabase.createClient(CLOUD_CONFIG.supabaseUrl, CLOUD_CONFIG.supabaseKey);
                        console.log("Supabase 初始化成功，开始同步云端祝福板！");
                        loadAllData();
                    } catch (err) {
                        console.error("Supabase 初始化失败，自动降级为本地存储模式:", err);
                        loadAllData();
                    }
                };
                script.onerror = () => {
                    console.error("Supabase CDN 载入失败，网络连通错误。自动降级为本地存储模式！");
                    loadAllData();
                };
                document.head.appendChild(script);
            } else {
                loadAllData();
            }
        }

        // 2. 将数据保存至本地
        function saveToLocalStorage() {
            localStorage.setItem('added_items', JSON.stringify(addedItems));
        }

        // 3. 核心：数据推送 (支持本地与云端)
        async function cloudPushItem(item) {
            if (CLOUD_CONFIG.enable && supabaseClient) {
                try {
                    // 清洗 id，提取数字用于主键
                    const numId = parseInt(item.id.replace('item_', '')) || Date.now();
                    const { error } = await supabaseClient
                        .from('madoka_bday')
                        .insert([{
                            id: numId,
                            type: item.type,
                            content: item.content,
                            x: item.x,
                            y: item.y,
                            rotation: item.rotation,
                            color: item.color,
                            styleType: item.styleType,
                            fontFamily: item.fontFamily,
                            caption: item.caption
                        }]);
                    if (error) throw error;
                    console.log("云端写入成功:", numId);
                } catch (err) {
                    console.error("云端写入失败，自动留存本地:", err);
                }
            }
        }

        // 4. 核心：拖拽位置同步 (支持本地与云端)
        async function cloudUpdatePosition(id, x, y) {
            if (CLOUD_CONFIG.enable && supabaseClient && id.startsWith('item_')) {
                try {
                    const numId = parseInt(id.replace('item_', ''));
                    if (isNaN(numId)) return;
                    const { error } = await supabaseClient
                        .from('madoka_bday')
                        .update({ x: x, y: y })
                        .eq('id', numId);
                    if (error) throw error;
                    console.log("云端坐标同步成功:", numId);
                } catch (err) {
                    console.error("云端坐标更新失败:", err);
                }
            }
        }

        // 5. 核心：删除心意卡 (支持本地与云端)
        async function cloudDeleteItem(id) {
            if (CLOUD_CONFIG.enable && supabaseClient && id.startsWith('item_')) {
                try {
                    const numId = parseInt(id.replace('item_', ''));
                    if (isNaN(numId)) return;
                    const { error } = await supabaseClient
                        .from('madoka_bday')
                        .delete()
                        .eq('id', numId);
                    if (error) throw error;
                    console.log("云端数据下架成功:", numId);
                } catch (err) {
                    console.error("云端数据下架失败:", err);
                }
            }
        }

        // 6. 加载全板面数据 (智能判定云端/本地)
        async function loadAllData() {
            // B. 智能加载新增的留言与贺图
            if (CLOUD_CONFIG.enable && supabaseClient) {
                try {
                    console.log("正在从云端拉取祝福列表...");
                    const { data, error } = await supabaseClient
                        .from('madoka_bday')
                        .select('*')
                        .order('id', { ascending: true });
                    
                    if (error) throw error;
                    
                    if (data) {
                        // 移除当前网页DOM中所有动态生成的节点，防止二次加载冲突
                        addedItems.forEach(item => {
                            const el = document.getElementById(item.id);
                            if (el) el.remove();
                        });

                        addedItems = data.map(dbItem => {
                            const item = {
                                id: 'item_' + dbItem.id,
                                type: dbItem.type,
                                content: dbItem.content,
                                x: dbItem.x,
                                y: dbItem.y,
                                rotation: dbItem.rotation,
                                color: dbItem.color,
                                styleType: dbItem.styleType || 'handwritten',
                                fontFamily: dbItem.fontFamily || "'Klee One', sans-serif"
                            };
                            
                            const deserialized = deserializeCaption(dbItem.caption, item);
                            item.caption = deserialized.caption;
                            if (deserialized.width) item.width = deserialized.width;
                            if (deserialized.height) item.height = deserialized.height;
                            if (deserialized.fontSize) item.fontSize = deserialized.fontSize;
                            
                            return item;
                        });
                        console.log(`成功载入云端 ${addedItems.length} 条心意卡！`);
                    }
                } catch (err) {
                    console.error("拉取云端数据失败，自动降级为本地离线存储:", err);
                    loadLocalFallback();
                }
            } else {
                loadLocalFallback();
            }

            // 渲染所有取得的项，确保都有合法坐标和大小
            addedItems.forEach((item, index) => {
                if (item.x === undefined || item.y === undefined || item.x === null || item.y === null) {
                    let w = 480, h = 420;
                    if (item.type === 'photo') {
                        w = 640;
                        h = 500;
                    }
                    const pos = getRandomPosition(w, h);
                    item.x = pos.x;
                    item.y = pos.y;
                    if (item.rotation === undefined || item.rotation === null) {
                        item.rotation = pos.rot;
                    }
                    
                    // 保存新分配的坐标
                    saveToLocalStorage();
                    cloudUpdatePosition(item.id, item.x, item.y);
                }

                // 确保卡片有合适的 4K 大小
                if (item.type === 'photo') {
                    if (!item.width || item.width < 350) {
                        item.width = 640; // 恢复 4K 拍立得宽度
                    }
                } else if (item.type === 'message') {
                    if (item.styleType === 'sticky') {
                        if (!item.width || item.width < 300) item.width = 480;
                        if (!item.height || item.height < 250) item.height = 420;
                        if (!item.fontSize || item.fontSize < 24) item.fontSize = 32;
                    } else {
                        if (!item.fontSize || item.fontSize < 30) item.fontSize = 54;
                    }
                }

                renderItem(item);
            });

            // 动态调节画布大小并完成自适应缩放
            adjustPosterHeight();
        }

        // 本地存储兜底拉取
        function loadLocalFallback() {
            const savedAdded = localStorage.getItem('added_items');
            if (savedAdded) {
                addedItems = JSON.parse(savedAdded);
            }
        }

        // 7. 一键清空/重置海报
        async function clearAllData() {
            if (confirm(TRANSLATIONS[currentLang].alertResetConfirm)) {
                if (CLOUD_CONFIG.enable && supabaseClient) {
                    try {
                        const { error } = await supabaseClient
                            .from('madoka_bday')
                            .delete()
                            .neq('id', 0); // 抹除所有行
                        if (error) throw error;
                        console.log("云端表已抹除！");
                    } catch (err) {
                        console.error("云端抹除失败:", err);
                    }
                }
                localStorage.removeItem('added_items');
                localStorage.removeItem('orig_positions');
                window.location.reload();
            }
        }

        // ==========================================
        // 🖼️ 元素渲染与创建 (Render Engine)
        // ==========================================
        
        // 1. 创建留言或拍立得实体并粘在画布上
        function renderItem(item) {
            const container = document.getElementById('posterContainer');
            let el = document.createElement('div');
            el.id = item.id;
            
            // 附上基本坐标和旋转微倾斜
            el.style.left = item.x + 'px';
            el.style.top = item.y + 'px';
            el.style.transform = `rotate(${item.rotation}deg)`;

            // 加上快捷删除按钮
            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
            delBtn.onclick = (e) => {
                e.stopPropagation();
                if (confirm(TRANSLATIONS[currentLang].alertDeleteConfirm)) {
                    // 从数组和DOM中删除
                    addedItems = addedItems.filter(i => i.id !== item.id);
                    saveToLocalStorage();
                    cloudDeleteItem(item.id);
                    el.remove();
                    adjustPosterHeight();
                }
            };
            el.appendChild(delBtn);

            if (item.type === 'message') {
                if (item.styleType === 'sticky') {
                    // A. 便签贴风格
                    el.className = `sticky-note ${item.color}`;
                    el.style.fontFamily = item.fontFamily;
                    if (item.width) el.style.width = item.width + 'px';
                    if (item.height) el.style.height = item.height + 'px';
                    if (item.fontSize) el.style.fontSize = item.fontSize + 'px';
                    
                    const textSpan = document.createElement('span');
                    textSpan.innerText = item.content;
                    el.appendChild(textSpan);
                } else {
                    // B. 直接手写字样风格
                    el.className = 'handwritten-msg';
                    el.style.fontFamily = item.fontFamily;
                    el.style.color = item.color;
                    if (item.fontSize) el.style.fontSize = item.fontSize + 'px';
                    
                    const textSpan = document.createElement('span');
                    textSpan.innerText = item.content;
                    el.appendChild(textSpan);
                }
            } else if (item.type === 'photo') {
                // C. 拍立得照片风格
                el.className = 'photo tape-effect';
                if (item.width) {
                    el.style.width = item.width + 'px';
                } else {
                    el.style.width = '320px'; // 移动端默认宽度
                }
                
                const img = document.createElement('img');
                img.src = item.content;
                img.alt = '粉丝贺图';
                el.appendChild(img);

                const cap = document.createElement('div');
                cap.className = 'photo-caption';
                cap.innerText = item.caption || '阿圆，生日快乐！';
                el.appendChild(cap);
            }

            // 智能注入旋转/缩放操作手柄
            addTransformHandles(el);

            container.appendChild(el);
            makeDraggable(el);
        }

        // ==========================================
        // 🖊️ 提交功能执行 (Submit Operations)
        // ==========================================
        
        // 生成随记倾斜与排布坐标（随机落在舒适的 4K 空白处）
        function getRandomPosition(itemWidth, itemHeight) {
            const container = document.getElementById('posterContainer');
            const containerH = parseFloat(container.style.height || 2160);
            
            const minX = 100;
            const maxX = Math.max(minX, 3840 - itemWidth - 100);
            
            // 放置在中间或下方的舒适空白处，避开最顶部的标题
            const minY = 500;
            const maxY = Math.max(minY + 200, containerH - itemHeight - 150);

            const rx = Math.floor(Math.random() * (maxX - minX + 1)) + minX;
            const ry = Math.floor(Math.random() * (maxY - minY + 1)) + minY;
            const rRot = Math.floor(Math.random() * 20) - 10; // 随机 -10deg 至 +10deg 微倾斜

            return { x: rx, y: ry, rot: rRot };
        }

        // 1. 提交流言按钮事件
        function submitMessage(customX = null, customY = null) {
            const textarea = document.getElementById('msgInput');
            const content = textarea.value.trim();

            if (!content) {
                alert(TRANSLATIONS[currentLang].alertEmptyMsg);
                return;
            }

            let posX, posY, rotationAngle;

            if (customX !== null && customY !== null) {
                posX = customX;
                posY = customY;
                rotationAngle = Math.floor(Math.random() * 16) - 8;
            } else {
                const itemWidth = (selectedStyle === 'sticky') ? 480 : 400;
                const itemHeight = (selectedStyle === 'sticky') ? 420 : 100;
                const pos = getRandomPosition(itemWidth, itemHeight);
                posX = pos.x;
                posY = pos.y;
                rotationAngle = pos.rot;
            }

            const newItem = {
                id: 'item_' + Date.now(),
                type: 'message',
                content: content,
                x: posX,
                y: posY,
                rotation: rotationAngle,
                color: selectedColor,
                styleType: selectedStyle,
                fontFamily: selectedFont,
                width: (selectedStyle === 'sticky') ? 480 : null,
                height: (selectedStyle === 'sticky') ? 420 : null,
                fontSize: (selectedStyle === 'sticky') ? 32 : 54
            };

            addedItems.push(newItem);
            saveToLocalStorage();
            cloudPushItem(newItem);
            renderItem(newItem);

            // 清空并折叠面板
            textarea.value = '';
            updateCharCounter('msgInput', 'charProgress', 'charCountText');
            document.getElementById('controlPanel').classList.remove('open');

            adjustPosterHeight();
            
            // 平滑滚动聚焦到新祝福语位置，给粉丝极佳的正反馈
            scrollToElement(newItem.id);
        }

        // 2. 提交贺图按钮事件
        function submitPhoto(customX = null, customY = null) {
            const captionInput = document.getElementById('captionInput');
            const caption = captionInput.value.trim();

            if (!uploadedPhotoData) {
                alert(TRANSLATIONS[currentLang].alertEmptyPhoto);
                return;
            }

            let posX, posY, rotationAngle;

            if (customX !== null && customY !== null) {
                posX = customX;
                posY = customY;
                rotationAngle = Math.floor(Math.random() * 10) - 5;
            } else {
                const pos = getRandomPosition(640, 500);
                posX = pos.x;
                posY = pos.y;
                rotationAngle = pos.rot;
            }

            const newItem = {
                id: 'item_' + Date.now(),
                type: 'photo',
                content: uploadedPhotoData,
                x: posX,
                y: posY,
                rotation: rotationAngle,
                caption: caption || '2026.05.25 生日纪念',
                width: 640
            };

            addedItems.push(newItem);
            saveToLocalStorage();
            cloudPushItem(newItem);
            renderItem(newItem);

            // 清空并折叠面板
            uploadedPhotoData = null;
            document.getElementById('uploadPreview').style.display = 'none';
            document.getElementById('uploadBox').style.display = 'block';
            captionInput.value = '';
            document.getElementById('controlPanel').classList.remove('open');

            adjustPosterHeight();
            scrollToElement(newItem.id);
        }

        // 平滑对齐定位到新贴的心意卡
        function scrollToElement(id) {
            setTimeout(() => {
                const el = document.getElementById(id);
                if (el) {
                    const rect = el.getBoundingClientRect();
                    const scale = getContainerScale();
                    // 考虑缩放因素滚动到屏幕中央
                    window.scrollTo({
                        top: window.scrollY + rect.top - (window.innerHeight / 2) + (rect.height / 2),
                        behavior: 'smooth'
                    });
                }
            }, 150);
        }

        // ==========================================
        // 🖱️ 双击海报空白处，在此处快捷贴卡
        // ==========================================
        function initCanvasClickEvent() {
            const container = document.getElementById('posterContainer');
            
            container.addEventListener('dblclick', function(e) {
                // 如果双击的是已有的照片、留言等，不应该触发添加
                if (e.target !== container && e.target.id !== 'posterContainer') {
                    return;
                }

                // 获取点击坐标
                const rect = container.getBoundingClientRect();
                const scale = getContainerScale();
                
                // 还原为 3840 像素的 4K 原始画布坐标
                const clickX = Math.round((e.clientX - rect.left) / scale);
                const clickY = Math.round((e.clientY - rect.top) / scale);

                doubleClickCoords = { x: clickX, y: clickY };

                openQuickDialog(e.clientX, e.clientY);
            });
        }

        function openQuickDialog(screenX, screenY) {
            const overlay = document.getElementById('overlay');
            const dialog = document.getElementById('quickDialog');
            
            overlay.style.display = 'block';
            dialog.style.display = 'block';

            if (window.innerWidth < 600) {
                // 移动端：直接屏幕居中
                dialog.style.left = '50%';
                dialog.style.top = '50%';
                dialog.style.transform = 'translate(-50%, -50%)';
                dialog.style.position = 'fixed';
            } else {
                // 桌面端：在双击位置附近，使用 fixed 定位
                dialog.style.position = 'fixed';
                dialog.style.transform = 'none';
                let dialogL = screenX - 200;
                let dialogT = screenY + 20;

                // 限制溢出屏幕边界
                dialogL = Math.max(20, Math.min(window.innerWidth - 420, dialogL));
                dialogT = Math.max(20, Math.min(window.innerHeight - 380, dialogT));

                dialog.style.left = dialogL + 'px';
                dialog.style.top = dialogT + 'px';
            }

            // 默认渲染写留言
            renderQuickForm('message');
        }

        function closeQuickDialog() {
            document.getElementById('overlay').style.display = 'none';
            const dialog = document.getElementById('quickDialog');
            dialog.style.display = 'none';
            dialog.style.transform = 'none';
            doubleClickCoords = null;
        }

                            <div class="progress-bar-bg"><div class="progress-bar-fill" id="quickCharProgress"></div></div>
                            <span id="quickCharCountText">还可以输入 15 汉字</span>
                        </div>
                    </div>
                `;
                
                const textarea = document.getElementById('quickMsgInput');
                textarea.focus();
                textarea.addEventListener('input', () => {
                    updateCharCounter('quickMsgInput', 'quickCharProgress', 'quickCharCountText');
                });
                updateCharCounter('quickMsgInput', 'quickCharProgress', 'quickCharCountText');
            } else {
                const dict = TRANSLATIONS[currentLang];
                formArea.innerHTML = `
                    <div class="form-group" style="margin-top: 10px;">
                        <div class="upload-placeholder" id="quickUploadBox" style="padding: 25px;">
                            <i class="fa-solid fa-cloud-arrow-up" style="font-size: 32px;"></i>

                            <input type="file" id="quickFileInput" accept="image/*" style="display: none;">

                        <img class="upload-preview" id="quickUploadPreview" style="max-height: 120px; display:none; margin: 10px auto 0 auto;">

                    <div class="form-group">
                        <input type="text" class="text-input" id="quickCaptionInput" placeholder="${dict.captionPlaceholder}" maxlength="25">

                const uploadBox = document.getElementById('quickUploadBox');
                const fileInput = document.getElementById('quickFileInput');
                const preview = document.getElementById('quickUploadPreview');

                uploadBox.onclick = () => fileInput.click();
                fileInput.onchange = function() {
                    const file = this.files[0];
                    if (file) {
                        compressImageFile(file, function(base64Data) {
                            uploadedPhotoData = base64Data;
                            preview.src = base64Data;
                            preview.style.display = 'block';
                            uploadBox.style.display = 'none';
                        });
                    }
                };
            }
        }

        // ==========================================
        // 🔌 初始化监听事件绑定 (DOM Event Listeners)
        // ==========================================
        window.addEventListener('DOMContentLoaded', () => {
            // A. 折叠手账控制面板打开与关闭
            const panel = document.getElementById('controlPanel');
            const tab = document.getElementById('panelTab');
            tab.onclick = () => {
                panel.classList.toggle('open');
                updatePanelTabText();
                const tabIcon = document.getElementById('panelTabIcon');
                if (tabIcon) {
                    if (panel.classList.contains('open')) {
                        tabIcon.className = 'fa-solid fa-book-bookmark';
                    } else {
                        tabIcon.className = 'fa-solid fa-book-open';
                    }
                }
            };

            // 🌐 A2. 多语言切换按钮监听
            document.getElementById('langZH').onclick = () => updateLanguage('zh');
            document.getElementById('langJA').onclick = () => updateLanguage('ja');
            document.getElementById('langEN').onclick = () => updateLanguage('en');

            // B. 墨水调色盘初始化
            renderColorPicker();

            // C. 自定义样式切换
            const btnHandwritten = document.getElementById('styleHandwritten');
            const btnSticky = document.getElementById('styleSticky');
            
            btnHandwritten.onclick = () => {
                selectedStyle = 'handwritten';
                btnHandwritten.classList.add('active');
                btnSticky.classList.remove('active');
                document.getElementById('groupFontSelect').style.display = 'block';
                renderColorPicker();
            };
            btnSticky.onclick = () => {
                selectedStyle = 'sticky';
                btnSticky.classList.add('active');
                btnHandwritten.classList.remove('remove');
                btnHandwritten.classList.remove('active');
                document.getElementById('groupFontSelect').style.display = 'block'; // 便签贴也允许选字体
                renderColorPicker();
            };

            // D. 字数检查
            const msgInput = document.getElementById('msgInput');
            msgInput.addEventListener('input', () => {
                updateCharCounter('msgInput', 'charProgress', 'charCountText');
            });
            updateCharCounter('msgInput', 'charProgress', 'charCountText');

            // E. 字体选择变化
            document.getElementById('fontSelect').onchange = function() {
                selectedFont = this.value;
            };

            // F. 控制面板照片上传
            const uploadBox = document.getElementById('uploadBox');
            const fileInput = document.getElementById('fileInput');
            const preview = document.getElementById('uploadPreview');
            
            uploadBox.onclick = () => fileInput.click();
            
            // 拖曳上传支持
            uploadBox.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadBox.style.borderColor = '#ff6f00';
            });
            uploadBox.addEventListener('dragleave', () => {
                uploadBox.style.borderColor = '#d7ccc8';
            });
            uploadBox.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadBox.style.borderColor = '#d7ccc8';
                const file = e.dataTransfer.files[0];
                if (file && file.type.startsWith('image/')) {
                    compressImageFile(file, function(base64Data) {
                        uploadedPhotoData = base64Data;
                        preview.src = base64Data;
                        preview.style.display = 'block';
                        uploadBox.style.display = 'none';
                    });
                }
            });

            fileInput.onchange = function() {
                const file = this.files[0];
                if (file) {
                    compressImageFile(file, function(base64Data) {
                        uploadedPhotoData = base64Data;
                        preview.src = base64Data;
                        preview.style.display = 'block';
                        uploadBox.style.display = 'none';
                    });
                }
            };

            // G. 各种按钮事件提交绑定
            document.getElementById('btnSubmitMsg').onclick = () => submitMessage();
            document.getElementById('btnSubmitPhoto').onclick = () => submitPhoto();
            document.getElementById('btnClearStorage').onclick = () => clearAllData();

            // H. 4K 缩放监听器与事件绑定
            const btnFit = document.getElementById('btnScaleFit');
            const btn1to1 = document.getElementById('btnScale1to1');
            
            if (btnFit && btn1to1) {
                btnFit.onclick = () => {
                    currentScaleMode = 'fit';
                    localStorage.setItem('scale_mode', 'fit');
                    applyScale();
                };
                
                btn1to1.onclick = () => {
                    currentScaleMode = '1to1';
                    localStorage.setItem('scale_mode', '1to1');
                    applyScale();
                };
            }
            
            window.addEventListener('resize', applyScale);

            // I. 磁带机播放控制（原生 Audio + 3 首 MP3 切换）
            const btnPlay = document.getElementById('btnPlay');
            const volumeSlider = document.getElementById('volumeSlider');
            const trackSelect = document.getElementById('midiSelect'); // 复用原 id

            // 默认加载 Summer Mirage
            initAudioPlayer();
            loadAndPlayTrack('Kimagure_Orange_Road_Summer_Mirage.mp3', false); // 不自动播放，等待用户点击

            btnPlay.onclick = () => {
                const player = initAudioPlayer();
                if (isMusicPlaying) {
                    player.pause();
                } else {
                    player.play().catch(err => console.log('播放被阻止:', err));
                }
            };

            volumeSlider.oninput = function() {
                const player = initAudioPlayer();
                player.volume = parseFloat(this.value);
            };

            trackSelect.onchange = function() {
                const filename = this.value;
                const player = initAudioPlayer();
                const wasPlaying = isMusicPlaying;

                loadAndPlayTrack(filename, wasPlaying);
            };

            // J. 移除原有固定大图拖拽手柄配置

            // K. 双击空白处召唤快捷窗口与弹框按钮
            initCanvasClickEvent();
            
            const overlay = document.getElementById('overlay');
            const quickClose = document.getElementById('quickClose');
            const quickModeMsg = document.getElementById('quickModeMsg');
            const quickModePhoto = document.getElementById('quickModePhoto');
            let currentQuickMode = 'message'; // 'message' or 'photo'

            overlay.onclick = () => {
                closeQuickDialog();
                closeManual();
            };
            quickClose.onclick = closeQuickDialog;

            quickModeMsg.onclick = () => {
                currentQuickMode = 'message';
                quickModeMsg.classList.add('active');
                quickModePhoto.classList.remove('active');
                renderQuickForm('message');
            };
            quickModePhoto.onclick = () => {
                currentQuickMode = 'photo';
                quickModePhoto.classList.add('active');
                quickModeMsg.classList.remove('active');
                renderQuickForm('photo');
            };

            document.getElementById('btnQuickSubmit').onclick = () => {
                if (!doubleClickCoords) return;
                
                if (currentQuickMode === 'message') {
                    // 写留言
                    const textVal = document.getElementById('quickMsgInput').value.trim();
                    if (!textVal) {
                        alert(TRANSLATIONS[currentLang].alertEmptyMsg);
                        return;
                    }
                    
                    const newItem = {
                        id: 'item_' + Date.now(),
                        type: 'message',
                        content: textVal,
                        x: Math.max(20, doubleClickCoords.x - 200), // 居中对齐，在4K上微调
                        y: doubleClickCoords.y - 100, // 稍微偏上对齐，避开双击正中
                        rotation: Math.floor(Math.random() * 12) - 6,
                        color: selectedColor,
                        styleType: selectedStyle,
                        fontFamily: selectedFont,
                        width: (selectedStyle === 'sticky') ? 480 : null,
                        height: (selectedStyle === 'sticky') ? 420 : null,
                        fontSize: (selectedStyle === 'sticky') ? 32 : 54
                    };
                    
                    addedItems.push(newItem);
                    saveToLocalStorage();
                    cloudPushItem(newItem);
                    renderItem(newItem);
                } else {
                    // 贴图片
                    if (!uploadedPhotoData) {
                        alert(TRANSLATIONS[currentLang].alertEmptyPhoto);
                        return;
                    }
                    const capVal = document.getElementById('quickCaptionInput').value.trim();
                    
                    const newItem = {
                        id: 'item_' + Date.now(),
                        type: 'photo',
                        content: uploadedPhotoData,
                        x: Math.max(20, doubleClickCoords.x - 320), // 拍立得是640像素，水平居中于双击点
                        y: doubleClickCoords.y - 250, // 纵向对齐居中
                        rotation: Math.floor(Math.random() * 10) - 5,
                        caption: capVal || '2026.05.25 生日庆祝',
                        width: 640
                    };
                    
                    addedItems.push(newItem);
                    saveToLocalStorage();
                    cloudPushItem(newItem);
                    renderItem(newItem);
                    
                    // 重置
                    uploadedPhotoData = null;
                }
                
                closeQuickDialog();
                adjustPosterHeight();
            };

            // 移动端触摸背景关闭激活的手柄
            document.getElementById('posterContainer').addEventListener('touchstart', function(e) {
                if (e.target === this || e.target.id === 'posterContainer') {
                    document.querySelectorAll('.photo, .handwritten-msg, .sticky-note').forEach(el => {
                        el.classList.remove('touch-active');
                    });
                }
            }, { passive: true });

            // L. 终极数据加载启动与多语言初次渲染
            updateLanguage(currentLang);
            checkAndInitCloud();
            initMobileCanvasGestures(); // 启动移动端长按手势
        });

        // ==========================================
        // 📱 移动端专属长按手势逻辑 (Long Press)
        // ==========================================
        let touchStartTimer = null;
        let isTouchDragging = false;
        let touchStartPos = { x: 0, y: 0 };

        function initMobileCanvasGestures() {
            const container = document.getElementById('posterContainer');

            container.addEventListener('touchstart', function(e) {
                // 如果触摸的不是容器本身，不触发长按
                if (e.target !== container && e.target.id !== 'posterContainer') {
                    return;
                }

                isTouchDragging = false;
                touchStartPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };

                // 启动 600ms 定时器
                clearTimeout(touchStartTimer);
                touchStartTimer = setTimeout(() => {
                    if (!isTouchDragging) {
                        // 触发长按
                        const rect = container.getBoundingClientRect();
                        const scale = getContainerScale();
                        
                        // 还原为 3840 像素 of 4K 原始画布坐标
                        const clickX = Math.round((e.touches[0].clientX - rect.left) / scale);
                        const clickY = Math.round((e.touches[0].clientY - rect.top) / scale);

                        doubleClickCoords = { x: clickX, y: clickY };
                        openQuickDialog(e.touches[0].clientX, e.touches[0].clientY);
                    }
                }, 600);
            }, { passive: true });

            container.addEventListener('touchmove', function(e) {
                // 如果用户手指移动了超过 10px，判定为滑动，取消长按
                if (touchStartPos) {
                    const dx = e.touches[0].clientX - touchStartPos.x;
                    const dy = e.touches[0].clientY - touchStartPos.y;
                    if (Math.sqrt(dx * dx + dy * dy) > 10) {
                        isTouchDragging = true;
                        clearTimeout(touchStartTimer);
                    }
                }
            }, { passive: true });

            container.addEventListener('touchend', function(e) {
                clearTimeout(touchStartTimer);
            }, { passive: true });
        }
    </script>
</body>
</html>
